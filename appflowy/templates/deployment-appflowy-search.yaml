{{- $p := (index .Values.workloads "appflowy-search") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-search
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: appflowy-search
spec:
  replicas: {{ (index .Values.workloads "appflowy-search").replicaCount }}
  selector:
    matchLabels:
      app: appflowy-search
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: appflowy-search
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: init-permissions
        image: "{{ .Values.images.init }}"
        command:
        - sh
        - -c
        - |
          set -x
          id
          ls -lan /keyword-index 2>&1 || true
          chown 1000:1000 /keyword-index
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: app-data
          mountPath: /keyword-index
      containers:
      - name: search
        image: "{{ .Values.images.search }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.ports.search }}
        env:
        - name: RUST_LOG
          value: info
        - name: APPFLOWY_SEARCH_HOST
          value: "[::]"
        - name: APPFLOWY_SEARCH_PORT
          value: "{{ .Values.ports.search }}"
        - name: APPFLOWY_SEARCH_REDIS_URL
          value: "redis://redis:{{ .Values.ports.redis }}"
        - name: APPFLOWY_KEYWORD_SEARCH_ENABLED
          value: "true"
        - name: APPFLOWY_KEYWORD_WORKER_ENABLED
          value: "true"
        - name: APPFLOWY_BACKGROUND_INDEXER_ENABLED
          value: "true"
        - name: APPFLOWY_INDEXER_DATABASE_ENABLED
          value: "false"
        - name: APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES
          value: "2147483648"
        - name: APPFLOWY_KEYWORD_INDEX_DIR
          value: /keyword-index
        - name: APPFLOWY_S3_USE_MINIO
          value: "true"
        - name: APPFLOWY_S3_MINIO_URL
          value: "http://minio:{{ .Values.ports.minioApi }}"
        - name: APPFLOWY_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: APPFLOWY_S3_ACCESS_KEY
        - name: APPFLOWY_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: APPFLOWY_S3_SECRET_KEY
        - name: APPFLOWY_S3_BUCKET
          value: appflowy
        - name: APPFLOWY_GOTRUE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: GOTRUE_JWT_SECRET
        - name: APPFLOWY_SEARCH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: APPFLOWY_DATABASE_URL
        resources:
          requests:
            cpu: {{ $p.requests.cpu }}
            memory: {{ $p.requests.memory }}
          limits:
            cpu: {{ $p.limits.cpu }}
            memory: {{ $p.limits.memory }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.ports.search }}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: {{ .Values.ports.search }}
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 10
      volumes:
      - name: app-data
        hostPath:
          path: "{{ .Values.userspace.appData }}/keyword-index"
          type: DirectoryOrCreate