{{- $jwt := include "appflowy.jwtSecret" . -}}
{{- $s3Access := include "appflowy.s3AccessKey" . -}}
{{- $s3Secret := include "appflowy.s3SecretKey" . -}}
{{- $dbHost := "appflowy-pg" -}}
{{- $dbPort := "5432" -}}
{{- $dbUser := "appflowy" -}}
{{- $dbName := "appflowy" -}}
{{- $dbPass := include "appflowy.pgPassword" . -}}
{{- $pgUrl := printf "postgres://%s:%s@%s:%s/%s" $dbUser (urlquery $dbPass) $dbHost $dbPort $dbName -}}
{{- $gotrueDbUrl := printf "%s?search_path=auth" $pgUrl -}}
{{- $oe := .Values.olaresEnv | default dict -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: appflowy-config
  namespace: "{{ .Release.Namespace }}"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Chart-generated, stable across upgrades and reinstalls (see PLAN-appflowy.md)
  GOTRUE_JWT_SECRET: {{ $jwt | quote }}
  APPFLOWY_S3_ACCESS_KEY: {{ $s3Access | quote }}
  APPFLOWY_S3_SECRET_KEY: {{ $s3Secret | quote }}
  MINIO_ROOT_USER: {{ $s3Access | quote }}
  MINIO_ROOT_PASSWORD: {{ $s3Secret | quote }}
  APPFLOWY_PG_PASSWORD: {{ $dbPass | quote }}
  # Database connections (bundled PostgreSQL — see PLAN-appflowy.md for rationale)
  APPFLOWY_DATABASE_URL: {{ $pgUrl | quote }}
  GOTRUE_DATABASE_URL: {{ $gotrueDbUrl | quote }}
  AI_DATABASE_URL: {{ $pgUrl | quote }}
  DATABASE_URL: {{ $pgUrl | quote }}
  APPFLOWY_WORKER_DATABASE_URL: {{ $pgUrl | quote }}
  APPFLOWY_WORKER_DATABASE_NAME: {{ $dbName | quote }}
  # User-supplied install credentials
  GOTRUE_ADMIN_EMAIL: {{ (index $oe "GOTRUE_ADMIN_EMAIL") | default "" | quote }}
  GOTRUE_ADMIN_PASSWORD: {{ (index $oe "GOTRUE_ADMIN_PASSWORD") | default "" | quote }}
  # SMTP (optional)
  GOTRUE_SMTP_HOST: {{ (index $oe "SMTP_HOST") | default "" | quote }}
  GOTRUE_SMTP_PORT: {{ (index $oe "SMTP_PORT") | default "465" | quote }}
  GOTRUE_SMTP_USER: {{ (index $oe "SMTP_USER") | default "" | quote }}
  GOTRUE_SMTP_PASS: {{ (index $oe "SMTP_PASS") | default "" | quote }}
  GOTRUE_SMTP_ADMIN_EMAIL: {{ (index $oe "SMTP_ADMIN_EMAIL") | default "" | quote }}
  APPFLOWY_MAILER_SMTP_HOST: {{ (index $oe "SMTP_HOST") | default "" | quote }}
  APPFLOWY_MAILER_SMTP_PORT: {{ (index $oe "SMTP_PORT") | default "465" | quote }}
  APPFLOWY_MAILER_SMTP_USERNAME: {{ (index $oe "SMTP_USER") | default "" | quote }}
  APPFLOWY_MAILER_SMTP_EMAIL: {{ (index $oe "SMTP_ADMIN_EMAIL") | default (index $oe "SMTP_USER") | default "" | quote }}
  APPFLOWY_MAILER_SMTP_PASSWORD: {{ (index $oe "SMTP_PASS") | default "" | quote }}
  APPFLOWY_MAILER_SMTP_TLS_KIND: {{ if (index $oe "SMTP_HOST") }}wrapper{{ else }}none{{ end }}
