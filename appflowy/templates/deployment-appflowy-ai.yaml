{{- $d := include "appflowy.publicDomain" . -}}
{{- $p := (index .Values.workloads "appflowy-ai") -}}
{{- $oe := .Values.olaresEnv | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-ai
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: appflowy-ai
spec:
  replicas: {{ (index .Values.workloads "appflowy-ai").replicaCount }}
  selector:
    matchLabels:
      app: appflowy-ai
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: appflowy-ai
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: ai
        image: "{{ .Values.images.ai }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.ports.ai }}
        env:
        - name: PORT
          value: "{{ .Values.ports.ai }}"
        - name: APP_ENVIRONMENT
          value: production
        - name: DEFAULT_AI_MODEL
          value: {{ index $oe "DEFAULT_AI_MODEL" | default "gpt-4.1-mini" | quote }}
        - name: DEFAULT_AI_COMPLETION_MODEL
          value: {{ index $oe "DEFAULT_AI_MODEL" | default "gpt-4.1-mini" | quote }}
        - name: AI_USE_MINIO
          value: "true"
        - name: AI_MINIO_URL
          value: "http://minio:{{ .Values.ports.minioApi }}"
        - name: AI_APPFLOWY_HOST
          value: "https://{{ $d }}"
        - name: AI_REDIS_URL
          value: "redis://redis:{{ .Values.ports.redis }}"
        - name: APPFLOWY_S3_BUCKET
          value: appflowy
        - name: APPFLOWY_GOTRUE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: GOTRUE_JWT_SECRET
        - name: APPFLOWY_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: APPFLOWY_S3_ACCESS_KEY
        - name: APPFLOWY_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: APPFLOWY_S3_SECRET_KEY
        {{- if (index $oe "AI_OPENAI_API_KEY") }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: AI_OPENAI_API_KEY
        {{- end }}
        {{- if (index $oe "OPENAI_BASE_URL") }}
        - name: OPENAI_BASE_URL
          value: {{ index $oe "OPENAI_BASE_URL" | quote }}
        {{- end }}
        envFrom:
        - secretRef:
            name: appflowy-config
        resources:
          requests:
            cpu: {{ $p.requests.cpu }}
            memory: {{ $p.requests.memory }}
          limits:
            cpu: {{ $p.limits.cpu }}
            memory: {{ $p.limits.memory }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.ports.ai }}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: {{ .Values.ports.ai }}
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 10