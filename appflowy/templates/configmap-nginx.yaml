apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy-nginx-conf
  namespace: "{{ .Release.Namespace }}"
data:
  nginx.conf: |
    # AppFlowy Cloud router for Olares.
    # Adapted from AppFlowy-Cloud/nginx/nginx.conf (official self-hosted compose).
    worker_processes auto;
    pid /var/run/nginx.pid;

    events {
        worker_connections 4096;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 75s;
        underscores_in_headers on;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
        access_log /dev/stdout main;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        # Trust private-network clients for real-ip so LAN access control works
        # behind the Olares edge proxy.
        real_ip_header X-Real-IP;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 100.64.0.0/10;
        set_real_ip_from 127.0.0.0/8;

        server {
            listen 8080;
            location = /stub_status {
                stub_status;
            }
        }

        server {
            listen 80;
            client_max_body_size 10M;
            server_tokens off;

            # Local health endpoint for the router itself.
            location = /healthz {
                access_log off;
                return 200 'ok';
            }

            # GoTrue auth
            location /gotrue/ {
                proxy_pass http://gotrue:9999/;
                proxy_set_header Host $http_host;
                proxy_pass_request_headers on;
            }

            # WebSocket collab
            location /ws {
                proxy_pass http://appflowy-cloud:8000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
            }

            # Main cloud API
            location /api {
                proxy_pass http://appflowy-cloud:8000;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {
                    proxy_pass http://appflowy-cloud:8000;
                    proxy_request_buffering off;
                    client_max_body_size 256M;
                }

                location /api/chat {
                    proxy_pass http://appflowy-cloud:8000;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    chunked_transfer_encoding on;
                    proxy_buffering off;
                    proxy_cache off;
                    proxy_read_timeout 600s;
                    proxy_connect_timeout 600s;
                    proxy_send_timeout 600s;
                }

                location /api/import {
                    proxy_pass http://appflowy-cloud:8000;
                    proxy_set_header Host $http_host;
                    proxy_read_timeout 600s;
                    proxy_connect_timeout 600s;
                    proxy_send_timeout 600s;
                    proxy_request_buffering off;
                    proxy_buffering off;
                    proxy_cache off;
                    client_max_body_size 2G;
                }
            }

            # MinIO web console — private networks only.
            location /minio/ {
                allow 10.0.0.0/8;
                allow 172.16.0.0/12;
                allow 192.168.0.0/16;
                allow 100.64.0.0/10;
                allow 127.0.0.1;
                deny all;

                proxy_pass http://minio:9001/;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 300s;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                chunked_transfer_encoding off;
            }

            # MinIO API (presigned upload/download) for native & web clients.
            # The Host header must match APPFLOWY_S3_MINIO_URL, the host the
            # presigned URLs were signed against.
            location /minio-api/ {
                proxy_pass http://minio:9000/;
                proxy_set_header Host minio:9000;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 300s;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
                proxy_request_buffering off;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                chunked_transfer_encoding off;
                client_max_body_size 0;
            }

            # Admin console — private networks only.
            location /console {
                allow 10.0.0.0/8;
                allow 172.16.0.0/12;
                allow 192.168.0.0/16;
                allow 100.64.0.0/10;
                allow 127.0.0.1;
                deny all;

                proxy_pass http://admin-frontend:3000;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_cache_bypass $http_upgrade;
            }

            # AI
            location /ai/ {
                proxy_pass http://appflowy-cloud:8000;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # AppFlowy Web UI
            location / {
                proxy_pass http://appflowy-web:80;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }