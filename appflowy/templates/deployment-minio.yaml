{{- $p := (index .Values.workloads "minio") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: minio
spec:
  replicas: {{ .Values.workloads.minio.replicaCount }}
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: "{{ .Values.images.minio }}"
        imagePullPolicy: IfNotPresent
        args:
        - server
        - /data
        - --console-address
        - ":{{ .Values.ports.minioConsole }}"
        ports:
        - containerPort: {{ .Values.ports.minioApi }}
        - containerPort: {{ .Values.ports.minioConsole }}
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: appflowy-config
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_BROWSER_REDIRECT_URL
          value: "https://{{ include "appflowy.publicDomain" . }}/minio"
        resources:
          requests:
            cpu: {{ $p.requests.cpu }}
            memory: {{ $p.requests.memory }}
          limits:
            cpu: {{ $p.limits.cpu }}
            memory: {{ $p.limits.memory }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.ports.minioApi }}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: {{ .Values.ports.minioApi }}
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 10
      volumes:
      - name: app-data
        hostPath:
          path: "{{ .Values.userspace.appData }}/minio"
          type: DirectoryOrCreate