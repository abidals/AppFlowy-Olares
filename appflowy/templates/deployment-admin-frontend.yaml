{{- $d := include "appflowy.publicDomain" . -}}
{{- $p := (index .Values.workloads "admin-frontend") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: admin-frontend
spec:
  replicas: {{ (index .Values.workloads "admin-frontend").replicaCount }}
  selector:
    matchLabels:
      app: admin-frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      containers:
      - name: admin
        image: "docker.io/appflowyinc/admin_frontend:0.18.2"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.ports.admin }}
        env:
        # The admin console is a Next.js app whose login must work behind the
        # Olares edge + router chain. Server actions break in that setup
        # (client/server action-id mismatch in the 0.18.1 image + forwarded
        # host checks), so we run the documented fallback mode: browser-side
        # login against the PUBLIC gotrue/cloud URLs.
        - name: APPFLOWY_ADMIN_DISABLE_SERVER_ACTIONS
          value: "true"
        - name: APPFLOWY_BASE_URL
          value: "https://{{ $d }}"
        - name: APPFLOWY_GOTRUE_BASE_URL
          value: "https://{{ $d }}/gotrue"
        - name: APPFLOWY_ALLOWED_ORIGINS
          value: "https://{{ $d }}"
        resources:
          requests:
            cpu: {{ $p.requests.cpu }}
            memory: {{ $p.requests.memory }}
          limits:
            cpu: {{ $p.limits.cpu }}
            memory: {{ $p.limits.memory }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.ports.admin }}
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: {{ .Values.ports.admin }}
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 10